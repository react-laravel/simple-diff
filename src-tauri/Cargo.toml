[package]
name = "simple-diff"
version = "0.1.0"
description = "A Beyond Compare-like file and directory comparison tool"
authors = ["sam"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "simple_diff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
notify = "7"
notify-debouncer-mini = "0.5"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
rayon = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
once_cell = "1"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# Signed macOS apps must not depend on Homebrew dylibs. Keep other platforms unchanged.
[target.'cfg(target_os = "macos")'.dependencies]
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
ssh2 = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_System_Threading"] }
